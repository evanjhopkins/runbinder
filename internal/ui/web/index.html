<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>RunBinder Console</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body x-data="dashboard()" x-init="start()">
  <header class="topbar">
    <div>
      <p class="eyebrow">LOCAL CONTROL ROOM</p>
      <h1>RunBinder</h1>
    </div>
    <div class="refresh" :class="status?.running ? 'online' : 'offline'">
      <span class="dot"></span>
      <span x-text="status?.running ? 'Service online' : 'Service offline'"></span>
    </div>
  </header>

  <main class="shell">
    <section class="hero panel">
      <div>
        <p class="eyebrow">SCHEDULER STATUS</p>
        <h2 x-text="status?.running ? 'Everything is running.' : 'The service is not running.'"></h2>
        <p class="muted" x-text="status?.heartbeat ? 'Last heartbeat ' + formatDate(status.heartbeat.last) : 'Waiting for a heartbeat.'"></p>
      </div>
      <div class="metric-grid">
        <div class="metric"><span>Tasks</span><strong x-text="tasks.length"></strong></div>
        <div class="metric"><span>Enabled</span><strong x-text="tasks.filter(task => task.Task.active).length"></strong></div>
        <div class="metric"><span>PID</span><strong x-text="status?.pid || '—'"></strong></div>
      </div>
    </section>

    <div class="workspace">
      <section class="panel tasks-panel">
        <div class="section-heading">
          <div><p class="eyebrow">REGISTRY</p><h2>Tasks</h2></div>
          <button class="icon-button" @click="refresh()" title="Refresh">↻</button>
        </div>
        <template x-if="error"><p class="error" x-text="error"></p></template>
        <template x-if="tasks.length === 0 && !error"><p class="empty">No registered tasks yet.</p></template>
        <div class="task-list">
          <template x-for="task in tasks" :key="task.Task.namespace">
            <button class="task-card" :class="selected === task.Task.namespace ? 'selected' : ''" @click="selectTask(task.Task.namespace)">
              <div class="task-title"><strong x-text="task.Task.namespace"></strong><span class="state" :class="task.Task.active ? 'active' : 'paused'" x-text="task.Task.active ? 'ACTIVE' : 'PAUSED'"></span></div>
              <div class="task-meta"><span x-text="task.Definition"></span><span x-text="task.Timezone"></span></div>
              <div class="task-result" x-text="task.LastRun ? (task.LastRun.success ? 'Succeeded' : 'Failed') + ' · ' + formatDate(task.LastRun.started_at) : 'No runs yet'"></div>
            </button>
          </template>
        </div>
      </section>

      <section class="panel detail-panel">
        <template x-if="selectedTask">
          <div>
            <div class="section-heading detail-heading">
              <div><p class="eyebrow">TASK DETAIL</p><h2 x-text="selectedTask.Task.namespace"></h2></div>
              <span class="state" :class="selectedTask.Task.active ? 'active' : 'paused'" x-text="selectedTask.Task.active ? 'ACTIVE' : 'PAUSED'"></span>
            </div>
            <div class="detail-meta"><span x-text="selectedTask.Task.working_dir"></span><span x-text="selectedTask.Timezone"></span></div>
            <div class="tabs">
              <button :class="tab === 'output' ? 'current' : ''" @click="tab = 'output'">Output</button>
              <button :class="tab === 'runs' ? 'current' : ''" @click="tab = 'runs'">Run history</button>
              <button :class="tab === 'definition' ? 'current' : ''" @click="tab = 'definition'">Definition</button>
            </div>
            <div class="log-window" x-show="tab === 'output'"><template x-if="taskLog.length"><pre x-text="taskLog.join('\n')"></pre></template><template x-if="!taskLog.length"><p class="empty">No task output recorded.</p></template></div>
            <div class="runs" x-show="tab === 'runs'">
              <template x-if="!runs.length"><p class="empty">No runs recorded.</p></template>
              <template x-for="run in runs" :key="run.id"><div class="run-row"><span class="run-status" :class="run.success ? 'success' : 'failure'" x-text="run.success ? 'PASS' : 'FAIL'"></span><span x-text="formatDate(run.started_at)"></span><span x-text="duration(run)"></span><span class="run-error" x-text="run.error"></span></div></template>
            </div>
            <div class="log-window definition" x-show="tab === 'definition'"><pre x-text="selectedTask.Task.definition"></pre></div>
          </div>
        </template>
        <template x-if="!selectedTask"><div class="empty detail-empty"><span class="big-mark">+</span><h2>Select a task</h2><p>Choose a task to inspect its output, history, and definition.</p></div></template>
      </section>
    </div>

    <section class="panel service-log-panel">
      <div class="section-heading"><div><p class="eyebrow">SERVICE LOG</p><h2>Internal events</h2></div><span class="muted" x-text="status?.recent_logs?.length + ' lines'"></span></div>
      <div class="log-window"><template x-if="status?.recent_logs?.length"><pre x-text="status.recent_logs.join('\n')"></pre></template><template x-if="!status?.recent_logs?.length"><p class="empty">No internal events recorded.</p></template></div>
    </section>
  </main>
  <script>
    function dashboard() {
      return {
        status: null, tasks: [], selected: null, selectedTask: null, taskLog: [], runs: [], tab: 'output', error: '',
        async start() { await this.refresh(); setInterval(() => this.refresh(), 4000); },
        async refresh() {
          try {
            const [status, tasks] = await Promise.all([fetch('/api/status').then(response => response.json()), fetch('/api/tasks').then(response => response.json())]);
            if (status.error || tasks.error) throw new Error(status.error || tasks.error);
            this.status = status; this.tasks = tasks; this.error = '';
            if (this.selected && this.tasks.some(task => task.Task.namespace === this.selected)) await this.selectTask(this.selected, false);
            else if (this.selected) { this.selected = null; this.selectedTask = null; }
          } catch (error) { this.error = error.message; }
        },
        async selectTask(namespace, resetTab = true) {
          this.selected = namespace; this.selectedTask = this.tasks.find(task => task.Task.namespace === namespace); if (resetTab) this.tab = 'output';
          const [log, runs] = await Promise.all([fetch('/api/tasks/' + encodeURIComponent(namespace) + '/log').then(response => response.json()), fetch('/api/tasks/' + encodeURIComponent(namespace) + '/runs').then(response => response.json())]);
          this.taskLog = log.error ? [] : log; this.runs = runs.error ? [] : runs;
        },
        formatDate(value) { return value ? new Date(value).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '—'; },
        duration(run) { if (!run.started_at || !run.finished_at) return '—'; return Math.max(0, (new Date(run.finished_at) - new Date(run.started_at)) / 1000).toFixed(1) + 's'; }
      };
    }
  </script>
</body>
</html>
